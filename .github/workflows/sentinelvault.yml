name: SentinelVault Security Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  secret-gate:
    name: SentinelVault Pre-Merge Inspection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run SentinelVault Inspection
        run: |
          echo "🛡️ [SentinelVault] Scanning repository files for hardcoded secrets..."

          # Inspect code for AWS keys, GitHub tokens, Slack keys, Stripe keys, Private Keys
          MATCHES=$(grep -rnE "(AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36}|sk_(live|test)_[0-9a-zA-Z]{16}|xox[baprs]-[0-9]{10}|AIza[0-9A-Za-z\-_]{35}|eyJ[A-Za-z0-9-_=]{10}\.|BEGIN.*PRIVATE KEY)" . \
            --exclude-dir=".git" \
            --exclude-dir=".github" || true)

          if [ -n "$MATCHES" ]; then
            echo ""
            echo "🛑 [CRITICAL SECRET DETECTED BY SENTINELVAULT]"
            echo "$MATCHES"
            echo ""
            echo "❌ BUILD BLOCKED: SentinelVault Policy Gate Intercepted Secret Leak!"
            echo "👉 Exit Code 1. Build halted! Code blocked from production."
            exit 1
          fi

          echo "✅ SentinelVault Gate Passed: Zero secrets detected."
